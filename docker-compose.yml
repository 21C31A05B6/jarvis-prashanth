# Local development stack only. These are NOT production secrets — this
# file is designed to be run with `docker compose up` on a laptop.
#
# The api service's secrets (JWT_SECRET, JARVIS_ENCRYPTION_KEY, DB/Redis
# passwords) are read from a local `.env.compose` file that is gitignored,
# never from hard-coded values in this file. Copy `.env.compose.example` to
# `.env.compose` and fill in your own locally-generated values before
# running this stack. Production deployments must supply their own secrets
# via the hosting platform's secret manager (see render.yaml / fly.toml)
# and MUST set JARVIS_ENV=production, which api/config.py's
# validate_production() enforces at startup — the app refuses to boot with
# any of the development-shaped defaults below.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.compose}
    volumes:
      - jarvis_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1
    volumes:
      - jarvis_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports: ["8000:8000"]
    env_file:
      - .env.compose
    environment:
      JARVIS_ENV: development
      JARVIS_HOSTED: "1"
      DATABASE_URL: postgresql://jarvis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.compose}@postgres:5432/jarvis
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      AUTO_CREATE_TABLES: "0"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes:
      - ./web:/app
      - jarvis_node_modules:/app/node_modules
    depends_on: [api]

volumes:
  jarvis_postgres:
  jarvis_redis:
  jarvis_node_modules:
